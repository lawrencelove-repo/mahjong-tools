<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riichi Mahjong Yaku Cheatsheet</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/tiles.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/yaku-data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script type="module" src="js/hand-verifier.js"></script>
</head>
<body>
  <header class="toolbar no-print">
    <h1>Riichi Yaku</h1>

    <label>
      Tiles
      <select id="tile-style" aria-label="Tile style">
        <option value="traditional">Traditional</option>
        <option value="custom">Custom</option>
        <option value="text">Text (NMJL)</option>
      </select>
    </label>

    <div class="group-radios" role="radiogroup" aria-label="Group by">
      <label><input type="radio" name="groupBy" value="han" checked /> By han</label>
      <label><input type="radio" name="groupBy" value="category" /> By category</label>
    </div>

    <button type="button" id="btn-settings">Settings</button>
    <button type="button" id="btn-print">Print / Save PDF</button>
  </header>

  <div id="settings-panel" class="no-print" hidden>
    <label>
      Language
      <select id="language">
        <option value="en">English</option>
        <option value="en-jp">English + Japanese</option>
        <option value="jp">Japanese</option>
      </select>
    </label>
    <label><input type="checkbox" id="opt-optional" /> Show optional / local yaku</label>
    <label><input type="checkbox" id="opt-double" /> Double-yakuman notes</label>
    <label><input type="checkbox" id="opt-dora" /> Dora / aka panel</label>
    <label><input type="checkbox" id="opt-extras" /> Extra tiles legend (flower, joker, blank, aka)</label>
    <label><input type="checkbox" id="opt-scoring" /> Scoring quick reference (page 2)</label>
    <label><input type="checkbox" id="opt-page2" /> Allow page 2 when content overflows</label>
    <label><input type="checkbox" id="opt-tile-key" /> Show tile Key (full tileset)</label>
    <label><input type="checkbox" id="opt-hand-verifier" /> Hand verification (scorer)</label>
    <label>
      Arabic numbers (top-right)
      <select id="rank-labels">
        <option value="hover">On hover</option>
        <option value="always">Always show</option>
        <option value="off">Off</option>
      </select>
    </label>
  </div>

  <section id="hand-verifier-root" class="aux-panel hand-verifier no-print" hidden></section>

  <main id="print-sheet">
    <div class="sheet-header">
      <h1>Riichi Mahjong · Yaku</h1>
      <span class="subtitle">Cheat sheet · US Letter landscape</span>
    </div>

    <div id="tile-legend" hidden></div>
    <div id="yaku-root"></div>
    <div id="aux-root"></div>

    <p class="credit">
      Traditional tile art: FluffyStuff/riichi-mahjong-tiles (CC0).
      Yaku list compiled from common public Riichi references. Not a substitute for your club’s rulesheet.
    </p>
  </main>
</body>
</html>
