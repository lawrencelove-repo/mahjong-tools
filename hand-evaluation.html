<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hand Evaluation · Riichi</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/tiles.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script type="module" src="js/hand-verifier.js"></script>
  <script defer src="js/hand-evaluation-app.js"></script>
</head>
<body class="hand-eval-page" data-tile-style="traditional">
  <header class="toolbar">
    <h1>Hand Evaluation</h1>
    <label>
      Tiles
      <select id="tile-style" aria-label="Tile style">
        <option value="traditional">Traditional</option>
        <option value="custom">Custom</option>
        <option value="text">Text (NMJL)</option>
      </select>
    </label>
    <label>
      Arabic numbers
      <select id="rank-labels">
        <option value="hover">On hover</option>
        <option value="always">Always show</option>
        <option value="off">Off</option>
      </select>
    </label>
  </header>
  <main id="hand-eval-root" class="hand-verifier"></main>
</body>
</html>
